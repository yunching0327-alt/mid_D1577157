                <h2>地標簡介：帝國製糖廠臺中營業所</h2>
                <p>
                    興建於日治昭和 10 年（1935 年），前身為日本帝國製糖株式會社之臺中工場辦公廳舍。
                    建築本體採鋼筋混凝土結構與國防色面磚，展現 1930 年代現代主義風格。
                    經修復重新開放後，結合產業展覽、冷氣餐飲與星泉湖生態綠地，轉型為極具溫潤歷史質感的「都市慢活文化綠洲」。
                </p>
